name: Build and publish EDU-DEX feed

on:
  schedule:
    # 15:00 UTC = 16:00/17:00 Europe/Amsterdam depending on DST.
    # EDU-DEX reads feeds nightly *after 18:00 Europe/Amsterdam*, so this
    # leaves a comfortable margin. Adjust if you want a different cadence.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/build-feed.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Check institute.yaml exists
        run: |
          if [ ! -f config/institute.yaml ]; then
            echo "::error::config/institute.yaml is missing. Copy config/institute.example.yaml to config/institute.yaml, fill it in, and commit it."
            exit 1
          fi

      - name: Build feed
        run: |
          python -m edudex_feed.main \
            --config config/institute.yaml \
            --overrides config/overrides.yaml \
            --approvals config/approvals.yaml \
            --feed-dir feed \
            --report-dir data \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Show XSD validation errors (debug)
        if: always()
        run: |
          echo "---- XSD validation errors section of data/report.md ----"
          awk '/## XSD validation errors/{found=1} found' data/report.md 2>/dev/null || echo "(no report.md found, or no XSD validation errors section)"

      - name: Upload run report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edudex-feed-report
          path: data/report.md

      # ADDED 2026-11-24 (Max): the team needs to be actively told about a
      # broken build or a flagged content change (a program the scraper can
      # no longer read correctly, an override drifting from what's now live
      # on vu.nl) -- not just have it sit in report.md/changelog.md on GitHub
      # Pages until someone thinks to check. These two steps read the signal
      # written by edudex_feed.main (data/notify.json) and, if it says
      # something's worth a look, post it to the "EDU-DEX feed alert" Teams
      # channel via its Workflows webhook. `if: always()` so this still runs
      # (and reports the break) even when "Build feed" above failed.
      - name: Check whether to notify Teams
        if: always()
        id: notify
        run: python3 scripts/notify_check.py data/notify.json >> "$GITHUB_OUTPUT"

      - name: Post Teams notification
        if: always() && steps.notify.outputs.should_notify == 'true'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS_WORD: ${{ steps.notify.outputs.build_failed == 'true' && 'BUILD FAILED' || 'content changed' }}
          SUMMARY: ${{ steps.notify.outputs.summary }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report.md
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          status_word = os.environ["STATUS_WORD"]
          summary = os.environ["SUMMARY"]
          run_url = os.environ["RUN_URL"]
          report_url = os.environ["REPORT_URL"]

          message_text = (
              f"**EDU-DEX feed: {status_word}**\n\n"
              f"{summary}\n\n"
              f"Run: {run_url}\n\n"
              f"Report: {report_url}"
          )

          # Confirmed 2026-11-24 (Max, via Hoppscotch): this Teams "Workflows"
          # webhook (the current replacement for the old deprecated Office
          # 365 Connectors) rejects a bare {"text": "..."} body -- it needs
          # either an Adaptive Card or legacy MessageCard payload. This is
          # the Adaptive Card shape, tested and confirmed working.
          payload = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "content": {
                          "type": "AdaptiveCard",
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "version": "1.4",
                          "body": [
                              {
                                  "type": "TextBlock",
                                  "text": message_text,
                                  "wrap": True,
                              }
                          ],
                      },
                  }
              ],
          }

          req = urllib.request.Request(
              os.environ["TEAMS_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("Teams webhook responded:", resp.status)
          PY

      - name: Upload feed for Pages
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
