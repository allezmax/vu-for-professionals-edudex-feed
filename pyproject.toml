[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edudex-feed"
version = "0.1.0"
description = "Scrapes vu.nl 'VU for Professionals' course pages and generates an EDU-DEX compliant XML feed."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
